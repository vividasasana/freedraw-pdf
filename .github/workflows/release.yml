name: Release
on:
  push:
    tags:
      - '*.*.*'
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate tag and version layout
        run: node scripts/check-repository.js --tag "$GITHUB_REF_NAME"
      - name: Check plugin
        run: npm run check
      - name: Build plugin
        run: npm run build
      - name: Verify deployment privacy
        shell: pwsh
        run: ./scripts/check-deployment.ps1
      - name: Recheck generated asset privacy
        run: npm run check:privacy
      - name: Package plugin
        run: |
          mkdir -p dist
          zip -j "dist/freedraw-pdf-${GITHUB_REF_NAME}.zip" manifest.json main.js styles.css
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            manifest.json
            main.js
            styles.css
            dist/freedraw-pdf-*.zip
      - name: Publish version notes and assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Freedraw PDF $GITHUB_REF_NAME" \
            --notes-file "docs/releases/${GITHUB_REF_NAME}.md" \
            manifest.json main.js styles.css "dist/freedraw-pdf-${GITHUB_REF_NAME}.zip"
